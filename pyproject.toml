[project]
name = "aabhar-backend"
version = "0.1.0"
description = "Aabhar Employee Recognition & Rewards Platform API"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "aiosmtplib>=3.0.0",
    "alembic>=1.13.0",
    "apscheduler[redis]>=3.10.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.115.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-sdk>=1.25.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.4.0",
    "pyjwt[crypto]>=2.9.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "redis>=5.0.0",
    "slack-sdk>=3.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30.0",
    "watchfiles>=1.0.0; sys_platform == 'win32'",
    "colorama>=0.4.6; sys_platform == 'win32'",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]