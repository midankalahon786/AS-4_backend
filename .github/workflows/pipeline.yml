name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  IMAGE: mrmonster786/rnr-backend
  TAG: ${{ github.run_number }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Python Quality Checks (unchanged)
  python-quality-checks:
    name: Python Quality Checks
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim
      options: --user 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install security tools
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install bandit pip-audit
      - name: Run Bandit and pip-audit in parallel
        run: |
          . venv/bin/activate
          bandit -r . --exclude ./venv,./tests -lll -iii -f json -o bandit-report.json &
          bandit -r . --exclude ./venv,./tests -lll -iii -f html  -o bandit-report.html &
          pip-audit --format json --output pip-audit-report.json &
          wait
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            bandit-report.html
            pip-audit-report.json

  # ── CHANGED: now pushes to DockerHub instead of saving a tarball ──
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: python-quality-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin
      - name: Build Docker image
        run: docker build -t $IMAGE:$TAG .
      - name: Push image to DockerHub
        run: |
          docker push $IMAGE:$TAG
          docker tag $IMAGE:$TAG $IMAGE:latest
          docker push $IMAGE:latest

  # ── CHANGED: deploys to EC2 via SSH instead of local docker run ──
  deploy-testing:
    name: Deploy to EC2 (Testing)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/pipeline-branch'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull mrmonster786/rnr-backend:latest
            docker stop rnr-backend-test || true
            docker rm   rnr-backend-test || true
            docker run -d \
              --name rnr-backend-test \
              --restart always \
              -p 8000:8000 \
              -e DATABASE_URL="${{ secrets.RR_BACKEND_DB_URL }}" \
              -e SECRET_KEY="${{ secrets.RR_BACKEND_SECRET_KEY }}" \
              -e SMTP_PASSWORD="${{ secrets.RR_BACKEND_SMTP_PASSWORD }}" \
              -e SMTP_USERNAME="${{ secrets.RR_BACKEND_SMTP_USERNAME }}" \
              -e SMTP_FROM_EMAIL="${{ secrets.RR_BACKEND_SMTP_FROM_EMAIL }}" \
              -e SMTP_HOST="smtp.gmail.com" \
              -e SMTP_PORT="587" \
              -e SMTP_USE_TLS="true" \
              -e SMTP_USE_SSL="false" \
              -e FRONTEND_URL="https://localhost:3000" \
              -e ACCESS_TOKEN_EXPIRE_MINUTES="30" \
              mrmonster786/rnr-backend:latest
            echo "Deployed to http://${{ secrets.EC2_HOST }}:8000"

  # 4. Publish Security Dashboard (unchanged)
  publish-reports:
    name: Publish Security Dashboard
    runs-on: ubuntu-latest
    needs: [python-quality-checks, build]
    if: always()
    steps:
      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
        continue-on-error: true
      - name: Upload HTML reports as dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-dashboard
          path: bandit-report.html
          if-no-files-found: warn