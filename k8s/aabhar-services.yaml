apiVersion: v1
kind: List
items:
  # AUTH SERVICE
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth
      namespace: aabhar
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: auth
      template:
        metadata:
          labels:
            app: auth
        spec:
          terminationGracePeriodSeconds: 45
          containers:
            - name: auth
              image: 192.168.42.141:5000/aabhar-backend:2
              imagePullPolicy: IfNotPresent
              args: ["src.auth.main:app", "--host", "0.0.0.0", "--port", "8001"]
              ports:
                - name: http
                  containerPort: 8001
              envFrom:
                - configMapRef:
                    name: aabhar-config
                - secretRef:
                    name: aabhar-runtime
                - secretRef:
                    name: aabhar-jwt
              startupProbe:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 20
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi

  - apiVersion: v1
    kind: Service
    metadata:
      name: auth-service
      namespace: aabhar
    spec:
      type: ClusterIP
      selector:
        app: auth
      ports:
        - name: http
          port: 8001
          targetPort: http

